<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="463" viewBox="0 0 1180 463" role="img"><title>CM-126 · 빈 카드 파일 전환</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="463" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-126 · 빈 카드 파일 전환</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">빈 Canvas 카드</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">MD / Canvas / Image로 전환 요구</text><text x="30" y="234" font-size="18" fill="#243247">입력: 파일 선택 열기</text><text x="30" y="263" font-size="18" fill="#243247">원본 이미지에는 빈 카드에서 파일 선택 UI를 열어 Markdown/Canvas/Image를 고르는 동작과 이미지 Panel</text><text x="30" y="292" font-size="18" fill="#243247">사용 요구가 있다. 이후 채팅에서 완결된 흐름·테스트는 미확인.</text><text x="30" y="321" font-size="18" fill="#243247">파일 전환의 저장/Undo/누락 여부는 추가 자료 대조</text><text x="30" y="350" font-size="18" fill="#243247">상태: 원본 검토 / 제품 동작 검증 아님</text><text x="30" y="379" font-size="18" fill="#243247">수용 테스트: T43</text></g></svg>