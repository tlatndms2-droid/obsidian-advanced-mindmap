<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-047 · 재실행 후 상태 복원</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-047 · 재실행 후 상태 복원</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">Auto Resize ON</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Auto Resize ON</text><text x="30" y="234" font-size="18" fill="#243247">입력: Obsidian 재시작</text><text x="30" y="263" font-size="18" fill="#243247">마지막 Auto Resize ON/OFF 값을 저장하고 Obsidian을 재시작해도 유지한다.</text><text x="30" y="292" font-size="18" fill="#243247"></text><text x="30" y="321" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T29</text></g></svg>