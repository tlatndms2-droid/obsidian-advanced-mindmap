<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="492" viewBox="0 0 1180 492" role="img"><title>CASE-T25 · 다중 색상 적용·Undo</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="492" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T25 · 다중 색상 적용·Undo</text><rect x="24" y="66" width="548" height="216" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">카드 선택</text><text x="44" y="169" font-size="20" fill="#243247">A 빨강 / B 파랑 / C 노랑</text><text x="44" y="198" font-size="20" fill="#243247">A 빨강</text><text x="44" y="227" font-size="20" fill="#243247">A 빨강 / B 파랑</text><rect x="608" y="66" width="548" height="216" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">커서 근처 팔레트</text><text x="628" y="169" font-size="20" fill="#243247">A·B·C 초록색 / 팔레트 닫힘</text><text x="628" y="198" font-size="20" fill="#243247">A 빨강 그대로</text><text x="628" y="227" font-size="20" fill="#243247">A 빨강 / B 파랑</text><text x="30" y="321" font-size="18" fill="#243247">입력: 다중 색상 적용·Undo</text><text x="30" y="350" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="379" font-size="18" fill="#243247">수용 기준: 지원 Item 일괄 적용, Undo 한 번에 각 원색 복원</text><text x="30" y="408" font-size="18" fill="#243247">CM-097, CM-098, CM-104, CM-106</text></g></svg>