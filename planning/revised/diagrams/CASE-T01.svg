<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="608" viewBox="0 0 1180 608" role="img"><title>CASE-T01 · Ctrl+방향키로 빈 공간에 카드 생성</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="608" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T01 · Ctrl+방향키로 빈 공간에 카드 생성</text><rect x="24" y="66" width="548" height="332" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">선택된 카드 1개</text><text x="44" y="169" font-size="20" fill="#243247">A 선택</text><text x="44" y="198" font-size="20" fill="#243247">A 선택</text><text x="44" y="227" font-size="20" fill="#243247">A 카드</text><text x="44" y="256" font-size="20" fill="#243247">A는 수동 확대한 카드</text><text x="44" y="285" font-size="20" fill="#243247">A 선택</text><text x="44" y="314" font-size="20" fill="#243247">B 생성 직후</text><rect x="608" y="66" width="548" height="332" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Ctrl 해제로 확정·닫기 / 모드 지속·Canvas</text><text x="628" y="169" font-size="20" fill="#243247">공유·재실행 유지</text><text x="628" y="198" font-size="20" fill="#243247">A 옆에 B 신규 카드, 연결선 없음</text><text x="628" y="227" font-size="20" fill="#243247">입력 방향으로 B 생성</text><text x="628" y="256" font-size="20" fill="#243247">A와 B의 지정 간격 100 Canvas px</text><text x="628" y="285" font-size="20" fill="#243247">B는 설정된 기본 카드 크기</text><text x="628" y="314" font-size="20" fill="#243247">B 선택 / A 선택 해제</text><text x="628" y="343" font-size="20" fill="#243247">편집 모드 진입 / 재입력 시 조작 모드</text><text x="30" y="437" font-size="18" fill="#243247">입력: Ctrl+방향키로 빈 공간에 카드 생성</text><text x="30" y="466" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="495" font-size="18" fill="#243247">수용 기준: 설정 기본 크기·Canvas 100px 간격, 새 카드 선택, 자동 편집 없음</text><text x="30" y="524" font-size="18" fill="#243247">CM-001, CM-002, CM-004, CM-005, CM-006, CM-007, CM-008</text></g></svg>