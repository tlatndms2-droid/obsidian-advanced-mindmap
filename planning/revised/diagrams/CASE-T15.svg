<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="463" viewBox="0 0 1180 463" role="img"><title>CASE-T15 · 탐색 길게·편집 중·다중 선택</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="463" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T15 · 탐색 길게·편집 중·다중 선택</text><rect x="24" y="66" width="548" height="187" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A,B 다중 선택</text><text x="44" y="169" font-size="20" fill="#243247">A 선택</text><text x="44" y="198" font-size="20" fill="#243247">A 텍스트 편집 중</text><rect x="608" y="66" width="548" height="187" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">선택 변경 없음</text><text x="628" y="169" font-size="20" fill="#243247">B까지만 이동</text><text x="628" y="198" font-size="20" fill="#243247">카드 탐색 없음</text><text x="30" y="292" font-size="18" fill="#243247">입력: 탐색 길게·편집 중·다중 선택</text><text x="30" y="321" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="350" font-size="18" fill="#243247">수용 기준: 길게 1회, 편집·다중 선택에서 미작동</text><text x="30" y="379" font-size="18" fill="#243247">CM-051, CM-060, CM-061</text></g></svg>