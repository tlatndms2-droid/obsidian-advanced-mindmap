<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="521" viewBox="0 0 1180 521" role="img"><title>CASE-T29 · 재시작·비활성화 후 데이터</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="521" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T29 · 재시작·비활성화 후 데이터</text><rect x="24" y="66" width="548" height="245" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">Auto Resize ON</text><text x="44" y="169" font-size="20" fill="#243247">작업.canvas 1번 A</text><text x="44" y="198" font-size="20" fill="#243247">작업.canvas A / 공부.canvas B</text><text x="44" y="227" font-size="20" fill="#243247">Canvas 카드 색상 적용</text><text x="44" y="256" font-size="20" fill="#243247">데이터 저장됨</text><rect x="608" y="66" width="548" height="245" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Auto Resize ON</text><text x="628" y="169" font-size="20" fill="#243247">1번 A 복원</text><text x="628" y="198" font-size="20" fill="#243247">B 취소 / A 유지</text><text x="628" y="227" font-size="20" fill="#243247">원본 카드/색상 유지</text><text x="628" y="256" font-size="20" fill="#243247">데이터 복원</text><text x="30" y="350" font-size="18" fill="#243247">입력: 재시작·비활성화 후 데이터</text><text x="30" y="379" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="408" font-size="18" fill="#243247">수용 기준: Waypoint·설정·색상 복원, Undo 기록은 재시작 시 초기화</text><text x="30" y="437" font-size="18" fill="#243247">CM-047, CM-078, CM-111, CM-117, CM-119</text></g></svg>