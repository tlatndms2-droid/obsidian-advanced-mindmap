<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="550" viewBox="0 0 1180 550" role="img"><title>CASE-T09 · 단일 카드 수동 크기 조절</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="550" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T09 · 단일 카드 수동 크기 조절</text><rect x="24" y="66" width="548" height="274" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">너비200 높이100</text><text x="44" y="169" font-size="20" fill="#243247">너비200</text><text x="44" y="198" font-size="20" fill="#243247">A와 B 동시 선택</text><text x="44" y="227" font-size="20" fill="#243247">A X100,Y100 W200</text><text x="44" y="256" font-size="20" fill="#243247">A 옆 B</text><text x="44" y="285" font-size="20" fill="#243247">작은 카드</text><rect x="608" y="66" width="548" height="274" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">너비220 높이100</text><text x="628" y="169" font-size="20" fill="#243247">너비220 (+20)</text><text x="628" y="198" font-size="20" fill="#243247">모두 크기 유지</text><text x="628" y="227" font-size="20" fill="#243247">X100,Y100 W220</text><text x="628" y="256" font-size="20" fill="#243247">A와 B 겹침, B 원위치</text><text x="628" y="285" font-size="20" fill="#243247">기본 Obsidian 최소 한계 적용</text><text x="30" y="379" font-size="18" fill="#243247">입력: 단일 카드 수동 크기 조절</text><text x="30" y="408" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="437" font-size="18" fill="#243247">수용 기준: ±20px, 좌상단 고정, 겹침 허용</text><text x="30" y="466" font-size="18" fill="#243247">CM-031, CM-032, CM-033, CM-034, CM-035, CM-036</text></g></svg>