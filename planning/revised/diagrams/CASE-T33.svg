<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="608" viewBox="0 0 1180 608" role="img"><title>CASE-T33 · Tab 연결 생성 / 일반 생성 비교</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="608" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T33 · Tab 연결 생성 / 일반 생성 비교</text><rect x="24" y="66" width="548" height="303" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A–B, A–C, A–D / B 선택</text><text x="44" y="169" font-size="20" fill="#243247">B 선택 / 일반 생성</text><text x="44" y="198" font-size="20" fill="#243247">A–B·A–C / B 선택</text><text x="44" y="227" font-size="20" fill="#243247">B와 C의 너비가 다름</text><text x="44" y="256" font-size="20" fill="#243247">B와 C 사이 빈 공간 충분</text><text x="44" y="285" font-size="20" fill="#243247">빈 공간 60px / 필요 공간 100px</text><rect x="608" y="66" width="548" height="303" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">A–B, A–E(선택), A–C, A–D</text><text x="628" y="169" font-size="20" fill="#243247">E를 B 아래 삽입, E의 연결선 없음</text><text x="628" y="198" font-size="20" fill="#243247">출발점 A 하나인 사례: B 아래 E 삽입 / A–E</text><text x="628" y="227" font-size="20" fill="#243247">연결</text><text x="628" y="256" font-size="20" fill="#243247">E 왼쪽 끝은 B와 동일</text><text x="628" y="285" font-size="20" fill="#243247">E만 빈 공간에 삽입, C·D 그대로</text><text x="628" y="314" font-size="20" fill="#243247">C·D를 40px 아래 이동</text><text x="30" y="408" font-size="18" fill="#243247">입력: Tab 연결 생성 / 일반 생성 비교</text><text x="30" y="437" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="466" font-size="18" fill="#243247">수용 기준: 동일 배치에서 일반 생성은 선 없음, 연결 생성의 출발점 A 하나인 사례는 A–E. 복수·출발점 없음은 결정 전</text><text x="30" y="495" font-size="18" fill="#243247">별도 보류.</text><text x="30" y="524" font-size="18" fill="#243247">CM-009, CM-010, CM-011, CM-012, CM-013, CM-014</text></g></svg>