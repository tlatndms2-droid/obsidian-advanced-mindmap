<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-124 · 유효성 오류 전체 중단</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-124 · 유효성 오류 전체 중단</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">현재 설정 B</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">B 유지 / 복원 중단 / 오류 알림</text><text x="30" y="234" font-size="18" fill="#243247">입력: 손상된 백업 열기</text><text x="30" y="263" font-size="18" fill="#243247">백업 파일이 손상되었거나 유효하지 않으면 부분 적용 없이 복원 전체 중단, 기존 모든 데이터 유지 및 오류 안내.</text><text x="30" y="292" font-size="18" fill="#243247"></text><text x="30" y="321" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T28,T42</text></g></svg>