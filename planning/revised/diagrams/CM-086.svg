<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-086 · 화면 경계</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-086 · 화면 경계</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">커서 화면 오른쪽 아래</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">전체 팝업 화면 안에 표시</text><text x="30" y="234" font-size="18" fill="#243247">입력: 팝업 열기</text><text x="30" y="263" font-size="18" fill="#243247">화면 가장자리에 커서가 있으면 팝업이 잘리지 않도록 자동으로 화면 안쪽으로 위치를 조정한다.</text><text x="30" y="292" font-size="18" fill="#243247"></text><text x="30" y="321" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T22,T39</text></g></svg>