<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="463" viewBox="0 0 1180 463" role="img"><title>CM-128 · 색상 단축키 설정</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="463" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-128 · 색상 단축키 설정</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">팔레트 사용</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">변경된 키 적용</text><text x="30" y="234" font-size="18" fill="#243247">입력: Obsidian 단축키 설정</text><text x="30" y="263" font-size="18" fill="#243247">원본 이미지에는 색상 단축키를 사용자가 설정할 수 있다는 표시가 있다. Ctrl+Alt+C 기본 팝업 단축키와 구분해</text><text x="30" y="292" font-size="18" fill="#243247">운영한다.</text><text x="30" y="321" font-size="18" fill="#243247"></text><text x="30" y="350" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="379" font-size="18" fill="#243247">수용 테스트: T35</text></g></svg>