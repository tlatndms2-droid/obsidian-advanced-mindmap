<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="492" viewBox="0 0 1180 492" role="img"><title>CM-011 · Tab 연결 모드</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="492" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-011 · Tab 연결 모드</text><rect x="24" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A–B·A–C / B 선택</text><rect x="608" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">출발점 A 하나인 사례: B 아래 E 삽입 / A–E</text><text x="628" y="169" font-size="20" fill="#243247">연결</text><text x="30" y="263" font-size="18" fill="#243247">입력: 연결 생성 / Tab</text><text x="30" y="292" font-size="18" fill="#243247">연결 생성 모드의 Tab도 같은 위치에 삽입한다. 기존 연결 출발점과의 연결 방식은 최초 원본의 연결 규칙과 대조한다.</text><text x="30" y="321" font-size="18" fill="#243247">원본 image_786.png·image(3).png로 기본 A–E 확인. 출발점 복수 또는 없음은 미확정; 숨겨진 계층 추가</text><text x="30" y="350" font-size="18" fill="#243247">금지.</text><text x="30" y="379" font-size="18" fill="#243247">상태: 재검토 / 제품 동작 검증 아님</text><text x="30" y="408" font-size="18" fill="#243247">수용 테스트: T33</text></g></svg>