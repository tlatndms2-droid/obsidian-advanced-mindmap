<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>T33 · Tab 연결 생성 / 일반 생성 비교</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">T33 · Tab 연결 생성 / 일반 생성 비교</text><rect x="24" y="66" width="548" height="187" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">독립 시험 사례별 초기 상태를 준비한다.</text><rect x="608" y="66" width="548" height="187" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">동일 배치에서 일반 생성은 선 없음, 연결 생성의</text><text x="628" y="169" font-size="20" fill="#243247">출발점 A 하나인 사례는 A–E. 복수·출발점 없음은</text><text x="628" y="198" font-size="20" fill="#243247">결정 전 별도 보류.</text><text x="30" y="292" font-size="18" fill="#243247">입력: Tab 연결 생성 / 일반 생성 비교</text><text x="30" y="321" font-size="18" fill="#243247">미실행 / 상세 절차: 04_ACCEPTANCE_TESTS.md</text><text x="30" y="350" font-size="18" fill="#243247">연결 요구사항: CM-009, CM-010, CM-011, CM-012, CM-013, CM-014</text></g></svg>