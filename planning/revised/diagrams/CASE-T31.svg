<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="637" viewBox="0 0 1180 637" role="img"><title>CASE-T31 · 대형 Canvas 성능·안전</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="637" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T31 · 대형 Canvas 성능·안전</text><rect x="24" y="66" width="548" height="361" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A B C 가로 배치</text><text x="44" y="169" font-size="20" fill="#243247">A B C D</text><text x="44" y="198" font-size="20" fill="#243247">B–D 연결 / A E 추가 예정</text><text x="44" y="227" font-size="20" fill="#243247">B–D 이동 경로에 X–X1</text><text x="44" y="256" font-size="20" fill="#243247">A, B, C 연결선 없음</text><text x="44" y="285" font-size="20" fill="#243247">A–B 연결 / A 선택</text><text x="44" y="314" font-size="20" fill="#243247">A–B, A–C, B–C</text><text x="44" y="343" font-size="20" fill="#243247">A B C</text><text x="44" y="372" font-size="20" fill="#243247">Canvas 카드 색상 적용</text><rect x="608" y="66" width="548" height="361" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">A E B C / A 좌표 유지</text><text x="628" y="169" font-size="20" fill="#243247">A E B C D</text><text x="628" y="198" font-size="20" fill="#243247">B 이동, D도 함께 이동</text><text x="628" y="227" font-size="20" fill="#243247">B·D·X·X1 동반 이동</text><text x="628" y="256" font-size="20" fill="#243247">E 생성 및 B·C 이동</text><text x="628" y="285" font-size="20" fill="#243247">A 위치 고정, B 이동</text><text x="628" y="314" font-size="20" fill="#243247">C 기존 좌표 유지</text><text x="628" y="343" font-size="20" fill="#243247">Ctrl+Z 한 번: A B C 복원</text><text x="628" y="372" font-size="20" fill="#243247">원본 카드/색상 유지</text><text x="30" y="466" font-size="18" fill="#243247">입력: 대형 Canvas 성능·안전</text><text x="30" y="495" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="524" font-size="18" fill="#243247">수용 기준: Pan/Zoom/Drag/연쇄 이동 후 노드 누락·파일 손상 없는지 측정</text><text x="30" y="553" font-size="18" fill="#243247">CM-015, CM-016, CM-017, CM-018, CM-019, CM-020, CM-021, CM-022, CM-117</text></g></svg>