<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="521" viewBox="0 0 1180 521" role="img"><title>CASE-T37 · 생성 후 입력 / 연결 Undo</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="521" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T37 · 생성 후 입력 / 연결 Undo</text><rect x="24" y="66" width="548" height="245" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A 선택</text><text x="44" y="169" font-size="20" fill="#243247">A 선택</text><text x="44" y="198" font-size="20" fill="#243247">B 생성 직후</text><text x="44" y="227" font-size="20" fill="#243247">A B C</text><text x="44" y="256" font-size="20" fill="#243247">카드 선택</text><rect x="608" y="66" width="548" height="245" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">A–B 연결과 B 신규 카드</text><text x="628" y="169" font-size="20" fill="#243247">B 선택 / A 선택 해제</text><text x="628" y="198" font-size="20" fill="#243247">편집 모드 진입 / 재입력 시 조작 모드</text><text x="628" y="227" font-size="20" fill="#243247">Ctrl+Z 한 번: A B C 복원</text><text x="628" y="256" font-size="20" fill="#243247">텍스트 편집 시작 / 다음 입력 시 종료</text><text x="30" y="350" font-size="18" fill="#243247">입력: 생성 후 입력 / 연결 Undo</text><text x="30" y="379" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="408" font-size="18" fill="#243247">수용 기준: 생성 후 비편집, 생성+연결선+밀어내기 Undo 1회</text><text x="30" y="437" font-size="18" fill="#243247">CM-003, CM-007, CM-008, CM-022, CM-127</text></g></svg>