<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="637" viewBox="0 0 1180 637" role="img"><title>CASE-T11 · Auto Resize ON 편집 종료</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="637" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T11 · Auto Resize ON 편집 종료</text><rect x="24" y="66" width="548" height="361" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">Auto Resize OFF</text><text x="44" y="169" font-size="20" fill="#243247">Auto Resize OFF</text><text x="44" y="198" font-size="20" fill="#243247">카드 내용과 크기 불일치</text><text x="44" y="227" font-size="20" fill="#243247">편집 중 높이160</text><text x="44" y="256" font-size="20" fill="#243247">내용 변경 없음</text><text x="44" y="285" font-size="20" fill="#243247">A 옆 B</text><text x="44" y="314" font-size="20" fill="#243247">기존 카드 100개, OFF</text><text x="44" y="343" font-size="20" fill="#243247">작업.canvas OFF / 공부.canvas OFF</text><text x="44" y="372" font-size="20" fill="#243247">내용이 다른 카드 A,B 선택</text><rect x="608" y="66" width="548" height="361" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Auto Resize ON</text><text x="628" y="169" font-size="20" fill="#243247">Auto Resize ON</text><text x="628" y="198" font-size="20" fill="#243247">가로·세로 내용에 맞춤</text><text x="628" y="227" font-size="20" fill="#243247">높이160 유지, 편집 종료시 Auto Resize</text><text x="628" y="256" font-size="20" fill="#243247">현재 내용으로 크기 맞춤</text><text x="628" y="285" font-size="20" fill="#243247">A 크기 변경, B 고정</text><text x="628" y="314" font-size="20" fill="#243247">기존 카드 크기 그대로</text><text x="628" y="343" font-size="20" fill="#243247">모든 Canvas ON</text><text x="628" y="372" font-size="20" fill="#243247">A/B 각각 내용에 따른 크기</text><text x="30" y="466" font-size="18" fill="#243247">입력: Auto Resize ON 편집 종료</text><text x="30" y="495" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="524" font-size="18" fill="#243247">수용 기준: 변경 없어도 내용 기준 가로/세로, 주변 이동 없음</text><text x="30" y="553" font-size="18" fill="#243247">CM-039, CM-040, CM-041, CM-042, CM-043, CM-044, CM-045, CM-046, CM-050</text></g></svg>