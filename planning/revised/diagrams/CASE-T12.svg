<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CASE-T12 · Auto Resize 크기 Undo</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T12 · Auto Resize 크기 Undo</text><rect x="24" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">텍스트 수정 + 자동 크기 맞춤</text><text x="44" y="169" font-size="20" fill="#243247">Auto Resize ON / 크기 취소</text><rect x="608" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">텍스트 유지 / 기존 크기 복원</text><text x="628" y="169" font-size="20" fill="#243247">내용 맞춤 다시 실행</text><text x="30" y="263" font-size="18" fill="#243247">입력: Auto Resize 크기 Undo</text><text x="30" y="292" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="321" font-size="18" fill="#243247">수용 기준: 첫 Undo는 크기만 복원, 텍스트 유지, ON 유지</text><text x="30" y="350" font-size="18" fill="#243247">CM-048, CM-049</text></g></svg>