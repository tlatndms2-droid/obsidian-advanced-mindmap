<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-103 · 색상 칩 삭제</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-103 · 색상 칩 삭제</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A 분홍 / 팔레트 분홍칩</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">A는 분홍 / 팔레트 칩 제거</text><text x="30" y="234" font-size="18" fill="#243247">입력: 칩 우클릭 삭제</text><text x="30" y="263" font-size="18" fill="#243247">사용자 색상 칩을 우클릭하면 저장 목록에서 삭제할 수 있으나 이미 색칠된 Canvas 카드는 변하지 않는다.</text><text x="30" y="292" font-size="18" fill="#243247"></text><text x="30" y="321" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T26</text></g></svg>