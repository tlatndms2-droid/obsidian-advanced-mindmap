<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-120 · 제거 후 재설치 보존 요구</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-120 · 제거 후 재설치 보존 요구</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">Waypoint·설정 보유</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">복원 요구 / 기술 미검증</text><text x="30" y="234" font-size="18" fill="#243247">입력: 플러그인 제거→재설치</text><text x="30" y="263" font-size="18" fill="#243247">제거 후 재설치에도 플러그인 전용 데이터 보존을 요구한다. 실제 제거 정책·저장 위치는 Codex가 검증해야 한다.</text><text x="30" y="292" font-size="18" fill="#243247"></text><text x="30" y="321" font-size="18" fill="#243247">상태: 기술 검증 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T30</text></g></svg>