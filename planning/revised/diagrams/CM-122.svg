<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-122 · 백업 위치 사용자 선택</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-122 · 백업 위치 사용자 선택</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">설정 화면</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Windows 저장창 표시</text><text x="30" y="234" font-size="18" fill="#243247">입력: 백업 클릭</text><text x="30" y="263" font-size="18" fill="#243247">Windows 저장 대화상자에서 백업 파일 저장 위치를 직접 선택한다.</text><text x="30" y="292" font-size="18" fill="#243247"></text><text x="30" y="321" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T27</text></g></svg>