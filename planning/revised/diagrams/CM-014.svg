<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-014 · Tab 부족분만 이동</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-014 · Tab 부족분만 이동</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">빈 공간 60px / 필요 공간 100px</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">C·D를 40px 아래 이동</text><text x="30" y="234" font-size="18" fill="#243247">입력: B에서 Tab</text><text x="30" y="263" font-size="18" fill="#243247">Tab 삽입에 공간이 부족하면 부족한 거리만큼 아래 연속 카드 전체를 이동한다. 이동 카드들의 기존 간격을 보존한다.</text><text x="30" y="292" font-size="18" fill="#243247">60/100/40은 추상 부족량 예시. 실제 계산 예에는 새 카드 높이와 각 간격의 측정 구간을 함께 표시해야 한다.</text><text x="30" y="321" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T05,T33</text></g></svg>