<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="550" viewBox="0 0 1180 550" role="img"><title>CASE-T26 · 사용자 색상 저장·삭제</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="550" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T26 · 사용자 색상 저장·삭제</text><rect x="24" y="66" width="548" height="274" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">기본 색상 6칩</text><text x="44" y="169" font-size="20" fill="#243247">사용자 색상 없음</text><text x="44" y="198" font-size="20" fill="#243247">분홍 칩 1개</text><text x="44" y="227" font-size="20" fill="#243247">작업.canvas 분홍 추가</text><text x="44" y="256" font-size="20" fill="#243247">A 분홍 / 팔레트 분홍칩</text><text x="44" y="285" font-size="20" fill="#243247">팔레트에 기본 색상 존재</text><rect x="608" y="66" width="548" height="274" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">기본+사용자 색상 목록</text><text x="628" y="169" font-size="20" fill="#243247">분홍 칩 즉시 추가</text><text x="628" y="198" font-size="20" fill="#243247">분홍 칩 여전히 1개</text><text x="628" y="227" font-size="20" fill="#243247">분홍 칩 그대로</text><text x="628" y="256" font-size="20" fill="#243247">A는 분홍 / 팔레트 칩 제거</text><text x="628" y="285" font-size="20" fill="#243247">별도의 리셋 버튼 없음</text><text x="30" y="379" font-size="18" fill="#243247">입력: 사용자 색상 저장·삭제</text><text x="30" y="408" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="437" font-size="18" fill="#243247">수용 기준: 중복 없는 공유 목록, 삭제 후 원본 색상 유지</text><text x="30" y="466" font-size="18" fill="#243247">CM-099, CM-100, CM-101, CM-102, CM-103, CM-105</text></g></svg>