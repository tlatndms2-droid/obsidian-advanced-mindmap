<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CASE-T05 · Tab 삽입 공간 일부 부족</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T05 · Tab 삽입 공간 일부 부족</text><rect x="24" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A–B, A–C, A–D / B 선택</text><text x="44" y="169" font-size="20" fill="#243247">빈 공간 60px / 필요 공간 100px</text><rect x="608" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">A–B, A–E(선택), A–C, A–D</text><text x="628" y="169" font-size="20" fill="#243247">C·D를 40px 아래 이동</text><text x="30" y="263" font-size="18" fill="#243247">입력: Tab 삽입 공간 일부 부족</text><text x="30" y="292" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="321" font-size="18" fill="#243247">수용 기준: 부족분만큼 아래 카드 이동, 기존 간격 유지</text><text x="30" y="350" font-size="18" fill="#243247">CM-009, CM-014</text></g></svg>