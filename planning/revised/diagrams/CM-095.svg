<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-095 · 이름 편집 외부 클릭</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-095 · 이름 편집 외부 클릭</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">미저장 이름 &quot;플롯&quot;</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">기존 이름 유지 + 팝업 닫힘</text><text x="30" y="234" font-size="18" fill="#243247">입력: 팝업 바깥 클릭</text><text x="30" y="263" font-size="18" fill="#243247">이름 편집 중 팝업 외부를 클릭하면 입력 내용을 취소하고 팝업을 닫는다.</text><text x="30" y="292" font-size="18" fill="#243247"></text><text x="30" y="321" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T23</text></g></svg>