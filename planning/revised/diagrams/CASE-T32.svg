<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="463" viewBox="0 0 1180 463" role="img"><title>CASE-T32 · 테마·단축키·기본 기능</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="463" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T32 · 테마·단축키·기본 기능</text><rect x="24" y="66" width="548" height="187" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">작업 누적</text><text x="44" y="169" font-size="20" fill="#243247">Canvas 카드 선택</text><text x="44" y="198" font-size="20" fill="#243247">A,B 선택 후 이동</text><rect x="608" y="66" width="548" height="187" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Obsidian 기본 한계 적용</text><text x="628" y="169" font-size="20" fill="#243247">기본 Canvas 이동 동작</text><text x="628" y="198" font-size="20" fill="#243247">위치 복원 / 선택 여부 미확정</text><text x="30" y="292" font-size="18" fill="#243247">입력: 테마·단축키·기본 기능</text><text x="30" y="321" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="350" font-size="18" fill="#243247">수용 기준: Light/Dark/Resize/키 충돌과 Canvas 기본 동작 검사</text><text x="30" y="379" font-size="18" fill="#243247">CM-112, CM-115, CM-116</text></g></svg>