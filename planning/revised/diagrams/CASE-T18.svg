<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="521" viewBox="0 0 1180 521" role="img"><title>CASE-T18 · 카드 위치 이동 후 Waypoint 호출</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="521" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T18 · 카드 위치 이동 후 Waypoint 호출</text><rect x="24" y="66" width="548" height="245" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">카드 A 등록 후 이동</text><text x="44" y="169" font-size="20" fill="#243247">1번 카드 A 등록</text><text x="44" y="198" font-size="20" fill="#243247">A 위치 P / 1번 등록</text><text x="44" y="227" font-size="20" fill="#243247">A 카드 / 1번 등록</text><text x="44" y="256" font-size="20" fill="#243247">A,B 카드 아주 근접</text><rect x="608" y="66" width="548" height="245" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">A의 새 위치로 / Zoom 유지</text><text x="628" y="169" font-size="20" fill="#243247">카드 A 중앙 이동</text><text x="628" y="198" font-size="20" fill="#243247">Num1 → Q로 이동</text><text x="628" y="227" font-size="20" fill="#243247">배지 화면 크기 일정</text><text x="628" y="256" font-size="20" fill="#243247">배지 서로 겹쳐도 고정</text><text x="30" y="350" font-size="18" fill="#243247">입력: 카드 위치 이동 후 Waypoint 호출</text><text x="30" y="379" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="408" font-size="18" fill="#243247">수용 기준: 현재 카드 위치·Zoom 유지</text><text x="30" y="437" font-size="18" fill="#243247">CM-062, CM-067, CM-081, CM-082, CM-083</text></g></svg>