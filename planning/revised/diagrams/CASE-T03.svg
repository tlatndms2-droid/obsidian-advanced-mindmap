<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="579" viewBox="0 0 1180 579" role="img"><title>CASE-T03 · 카드 생성과 밀어내기 Undo/Redo</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="579" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T03 · 카드 생성과 밀어내기 Undo/Redo</text><rect x="24" y="66" width="548" height="303" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A B C</text><text x="44" y="169" font-size="20" fill="#243247">작업 적용</text><text x="44" y="198" font-size="20" fill="#243247">생성 → 크기 → 색상</text><text x="44" y="227" font-size="20" fill="#243247">생성·크기·색상 취소됨</text><text x="44" y="256" font-size="20" fill="#243247">크기 Undo 상태</text><text x="44" y="285" font-size="20" fill="#243247">A,B,C 동시 선택</text><text x="44" y="314" font-size="20" fill="#243247">A,B 선택</text><rect x="608" y="66" width="548" height="303" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Ctrl+Z 한 번: A B C 복원</text><text x="628" y="169" font-size="20" fill="#243247">취소 / 다시 적용</text><text x="628" y="198" font-size="20" fill="#243247">색상 → 크기 → 생성 취소</text><text x="628" y="227" font-size="20" fill="#243247">생성 → 크기 → 색상</text><text x="628" y="256" font-size="20" fill="#243247">이전 크기 Redo 불가</text><text x="628" y="285" font-size="20" fill="#243247">A,B,C 원위치</text><text x="628" y="314" font-size="20" fill="#243247">누름 전 위치 복원</text><text x="30" y="408" font-size="18" fill="#243247">입력: 카드 생성과 밀어내기 Undo/Redo</text><text x="30" y="437" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="466" font-size="18" fill="#243247">수용 기준: Undo 한 번에 생성/밀어내기 전부 복원, Redo 재적용</text><text x="30" y="495" font-size="18" fill="#243247">CM-022, CM-107, CM-108, CM-109, CM-110, CM-113, CM-114</text></g></svg>