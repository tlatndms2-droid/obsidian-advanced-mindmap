<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CASE-T36 · 생성 모드 Context Menu</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T36 · 생성 모드 Context Menu</text><rect x="24" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">선택된 카드 1개</text><rect x="608" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Ctrl 해제로 확정·닫기 / 모드 지속·Canvas</text><text x="628" y="169" font-size="20" fill="#243247">공유·재실행 유지</text><text x="30" y="263" font-size="18" fill="#243247">입력: 생성 모드 Context Menu</text><text x="30" y="292" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="321" font-size="18" fill="#243247">수용 기준: Ctrl 약 1초 후 작은 메뉴, ↑/↓ 모드 선택</text><text x="30" y="350" font-size="18" fill="#243247">CM-001</text></g></svg>