<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="579" viewBox="0 0 1180 579" role="img"><title>CASE-T13 · Alt 탐색 기본</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="579" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T13 · Alt 탐색 기본</text><rect x="24" y="66" width="548" height="303" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A 왼쪽 / B 가까이 / C 멀리</text><text x="44" y="169" font-size="20" fill="#243247">B,C 동일 거리 / B 중심선 가까움</text><text x="44" y="198" font-size="20" fill="#243247">A 오른쪽 Group, B 카드</text><text x="44" y="227" font-size="20" fill="#243247">A 오른쪽 빈 공간</text><text x="44" y="256" font-size="20" fill="#243247">B가 화면 오른쪽 가장자리</text><text x="44" y="285" font-size="20" fill="#243247">현재 Canvas Zoom 40%</text><text x="44" y="314" font-size="20" fill="#243247">A 선택</text><rect x="608" y="66" width="548" height="303" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">B 선택</text><text x="628" y="169" font-size="20" fill="#243247">B 선택</text><text x="628" y="198" font-size="20" fill="#243247">B 선택</text><text x="628" y="227" font-size="20" fill="#243247">A 선택 유지</text><text x="628" y="256" font-size="20" fill="#243247">B 화면 가운데</text><text x="628" y="285" font-size="20" fill="#243247">Zoom 40% 유지</text><text x="628" y="314" font-size="20" fill="#243247">250ms 이동 후 B 중심</text><text x="30" y="408" font-size="18" fill="#243247">입력: Alt 탐색 기본</text><text x="30" y="437" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="466" font-size="18" fill="#243247">수용 기준: 방향 최단 카드 선택, 중앙, Zoom 유지, 250ms</text><text x="30" y="495" font-size="18" fill="#243247">CM-052, CM-053, CM-054, CM-055, CM-056, CM-057, CM-058</text></g></svg>