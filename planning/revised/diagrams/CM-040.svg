<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="463" viewBox="0 0 1180 463" role="img"><title>CM-040 · 기본 단축키</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="463" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-040 · 기본 단축키</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">Auto Resize OFF</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Auto Resize ON</text><text x="30" y="234" font-size="18" fill="#243247">입력: Ctrl+Shift+R</text><text x="30" y="263" font-size="18" fill="#243247">Auto Resize 토글 기본 단축키 Ctrl+Shift+R, Obsidian 설정에서 변경 가능. 사용자가 기존 단축키</text><text x="30" y="292" font-size="18" fill="#243247">제안을 &quot;확정하고&quot;라고 승인한 대화 기록에 근거.</text><text x="30" y="321" font-size="18" fill="#243247"></text><text x="30" y="350" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="379" font-size="18" fill="#243247">수용 테스트: T11</text></g></svg>