<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="463" viewBox="0 0 1180 463" role="img"><title>CASE-T27 · 설정 백업·정상 복원</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="463" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T27 · 설정 백업·정상 복원</text><rect x="24" y="66" width="548" height="187" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">Settings / Waypoint / 색상 목록</text><text x="44" y="169" font-size="20" fill="#243247">설정 화면</text><text x="44" y="198" font-size="20" fill="#243247">현재 설정 B / 백업 A</text><rect x="608" y="66" width="548" height="187" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">설정만 파일에 포함</text><text x="628" y="169" font-size="20" fill="#243247">Windows 저장창 표시</text><text x="628" y="198" font-size="20" fill="#243247">승인: 설정 A / 취소: B 유지</text><text x="30" y="292" font-size="18" fill="#243247">입력: 설정 백업·정상 복원</text><text x="30" y="321" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="350" font-size="18" fill="#243247">수용 기준: 설정만 포함, 경로 직접 선택, 승인 후 전체 교체</text><text x="30" y="379" font-size="18" fill="#243247">CM-121, CM-122, CM-123</text></g></svg>