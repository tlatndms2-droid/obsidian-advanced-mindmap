<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="521" viewBox="0 0 1180 521" role="img"><title>CM-001 · 생성 모드 선택</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="521" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-001 · 생성 모드 선택</text><rect x="24" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">선택된 카드 1개</text><rect x="608" y="66" width="548" height="158" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">Ctrl 해제로 확정·닫기 / 모드 지속·Canvas</text><text x="628" y="169" font-size="20" fill="#243247">공유·재실행 유지</text><text x="30" y="263" font-size="18" fill="#243247">입력: Ctrl 약 1초 + 메뉴 ↑/↓</text><text x="30" y="292" font-size="18" fill="#243247">Ctrl을 약 1초 누르면 작은 생성 Context Menu가 열리고 상하 방향키로 생성/연결 생성 중 선택한다. Ctrl을</text><text x="30" y="321" font-size="18" fill="#243247">놓으면 가리킨 모드로 확정하고 메뉴를 닫는다. 다시 변경할 때까지 모든 Canvas에서 같은 모드를 사용하며 재실행 후 마지막</text><text x="30" y="350" font-size="18" fill="#243247">모드를 복원한다. 변경은 Ctrl 약 1초로 메뉴를 다시 열어 수행한다. 별도 취소 동작은 추가하지 않는다.</text><text x="30" y="379" font-size="18" fill="#243247">출처: 사용자가 이 대화에서 직접 확정한 답변. 기존 자료 폐기와 사용자 확정 답변을 구별.</text><text x="30" y="408" font-size="18" fill="#243247">상태: 확정 / 제품 동작 검증 아님</text><text x="30" y="437" font-size="18" fill="#243247">수용 테스트: T01,T02,T36</text></g></svg>