<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="434" viewBox="0 0 1180 434" role="img"><title>CM-116 · Undo 후 선택 상태</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="434" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CM-116 · Undo 후 선택 상태</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">A,B 선택 후 이동</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">위치 복원 / 선택 여부 미확정</text><text x="30" y="234" font-size="18" fill="#243247">입력: Ctrl+Z</text><text x="30" y="263" font-size="18" fill="#243247">다중 선택 이동을 Undo한 뒤 선택 상태의 유지/해제는 사용자 미확정이다. 먼저 Obsidian 기본 동작을 검증한다.</text><text x="30" y="292" font-size="18" fill="#243247">상태를 임의로 확정하지 말 것</text><text x="30" y="321" font-size="18" fill="#243247">상태: 기술 검증 / 제품 동작 검증 아님</text><text x="30" y="350" font-size="18" fill="#243247">수용 테스트: T32</text></g></svg>