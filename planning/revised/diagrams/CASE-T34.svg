<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="405" viewBox="0 0 1180 405" role="img"><title>CASE-T34 · Ctrl+Space 편집 전환</title><g font-family="Malgun Gothic, sans-serif"><rect width="1180" height="405" fill="#f8fafc"/><text x="24" y="38" font-size="23" fill="#243247">CASE-T34 · Ctrl+Space 편집 전환</text><rect x="24" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="44" y="99" font-size="18" fill="#243247">실행前</text><text x="44" y="140" font-size="20" fill="#243247">카드 선택</text><rect x="608" y="66" width="548" height="129" rx="8" fill="white" stroke="#cbd5e1"/><text x="628" y="99" font-size="18" fill="#243247">실행 후 · 기대 상태</text><text x="628" y="140" font-size="20" fill="#243247">텍스트 편집 시작 / 다음 입력 시 종료</text><text x="30" y="234" font-size="18" fill="#243247">입력: Ctrl+Space 편집 전환</text><text x="30" y="263" font-size="18" fill="#243247">별개 조건별 독립 시험: 각 줄은 별도의 준비/결과다.</text><text x="30" y="292" font-size="18" fill="#243247">수용 기준: 선택 상태 → 편집 → 조작 상태 전환, 입력 손실 없음</text><text x="30" y="321" font-size="18" fill="#243247">CM-127</text></g></svg>