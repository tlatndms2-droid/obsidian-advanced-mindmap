<text x="656" y="571" font-size="17" fill="#17253a" font-weight="400" text-anchor="start" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">C: X=100, Y=100</text>
<text x="656" y="596" font-size="17" fill="#17253a" font-weight="400" text-anchor="start" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">E: X=120, Y=360</text>
