<text x="27" y="77" font-size="18" fill="#166534" font-weight="700" text-anchor="start" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">사용자 결정: 기존 간격 유지 우선 · 필요 시 Y좌표 보정 · X좌표는 서로 교환</text>
