<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" role="img" aria-label="SWAP-01 기존 간격 유지 확정: E와 C의 순서를 바꾸되 가로 위치는 서로 교환, 세로 좌표는 간격 100을 유지하도록 보정">
