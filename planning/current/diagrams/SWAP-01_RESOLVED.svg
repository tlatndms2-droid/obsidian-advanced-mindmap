<text x="44" y="717" font-size="16" fill="#17253a" font-weight="400" text-anchor="start" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">검증: E 이전 하단=180, C 이전 상단=280 → 100px / C 새 하단=260, E 새 상단=360 → 100px</text>
