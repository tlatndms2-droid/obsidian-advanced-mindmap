<rect x="713" y="177" width="202" height="160" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="814.0" y="263.0" font-size="18" fill="#162436" font-weight="700" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">C / 높이 160</text>
